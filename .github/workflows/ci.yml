name: CI

on:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
          - platform: linux-x64
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Install Qt (Linux)
        if: runner.os == 'Linux'
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.11.3
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtshadertools qtwebsockets qtnetworkauth qttasktree qtmultimedia
          cache: true

      # aqtinstall 3.3 cannot read Qt 6.11's new Windows package layout, so the action only
      # installs the MinGW toolchain and a small script installs the Qt kit itself.
      - name: Install MinGW (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          tools-only: true
          host: windows
          target: desktop
          tools: tools_mingw1310,qt.tools.win64_mingw1310
          cache: true

      - name: Cache Qt (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/Qt
          key: qt-6.11.3-win64_mingw-shadertools-websockets-networkauth-tasktree-multimedia-v1

      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          root="$(cygpath -m "$RUNNER_TEMP")/Qt"
          kit="$root/6.11.3/mingw_64"
          if [ ! -d "$kit/lib/cmake/Qt6" ]; then
            python .github/scripts/install_qt_windows.py --version 6.11.3 --arch win64_mingw \
              --flavor mingw --modules qtshadertools qtwebsockets qtnetworkauth qttasktree qtmultimedia \
              --output "$root"
          fi
          echo "QT_ROOT_DIR=$kit" >> "$GITHUB_ENV"
          echo "$kit/bin" >> "$GITHUB_PATH"
          echo "$(cygpath -m "$IQTA_TOOLS")/mingw1310_64/bin" >> "$GITHUB_PATH"

      - name: Build MySQL driver (Windows)
        if: runner.os == 'Windows'
        # Optional for the app itself; the release workflow treats a failure as fatal.
        continue-on-error: true
        shell: bash
        run: |
          .github/scripts/build_mysql_driver.sh 6.11.3 "$QT_ROOT_DIR" \
            "$(cygpath -m "$IQTA_TOOLS")/mingw1310_64/bin/g++.exe" \
            "$(cygpath -m "$RUNNER_TEMP")/mysql-runtime"
          echo "MYSQL_RUNTIME=$(cygpath -m "$RUNNER_TEMP")/mysql-runtime" >> "$GITHUB_ENV"

      - name: Install Linux runtime packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1-mesa-dri libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xfixes0

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_CXX_COMPILER="$IQTA_TOOLS/mingw1310_64/bin/g++.exe"

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Demo tour with screenshots (Linux, software rendering)
        if: runner.os == 'Linux'
        run: |
          mkdir -p tour
          xvfb-run -a -s "-screen 0 1400x900x24" \
            ./build/Hyperlancer --tour "$PWD/tour" --settings "$PWD/tour-settings.ini" \
              --data-dir "$PWD/tour-data" 2>&1 | tee tour.log
          grep -q "TOUR stress OK" tour.log

      - name: Upload screenshots
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v5
        with:
          name: tour-screenshots
          path: tour/*.png
          if-no-files-found: error
          retention-days: 14

  python-tools:
    name: Python tools (pytest)
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Run tests
        working-directory: web-dashboard/scripts
        run: |
          uv sync
          uv run pytest -q
