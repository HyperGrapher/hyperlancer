name: Build portable releases

on:
  push:
    tags:
      - 'v*.*.*'
  # Manual run: builds the current commit and creates the tag together with the release.
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to create, for example v0.2.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }} package
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
          - platform: linux-x64
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Install Qt (Linux)
        if: runner.os == 'Linux'
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.11.3
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtshadertools qtwebsockets qtnetworkauth qttasktree
          cache: true

      # aqtinstall 3.3 cannot read Qt 6.11's new Windows package layout, so the action only
      # installs the MinGW toolchain and a small script installs the Qt kit itself.
      - name: Install MinGW (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          tools-only: true
          host: windows
          target: desktop
          tools: tools_mingw1310,qt.tools.win64_mingw1310
          cache: true

      - name: Cache Qt (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/Qt
          key: qt-6.11.3-win64_mingw-shadertools-websockets-networkauth-tasktree-v1

      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          root="$(cygpath -m "$RUNNER_TEMP")/Qt"
          kit="$root/6.11.3/mingw_64"
          if [ ! -d "$kit/lib/cmake/Qt6" ]; then
            python .github/scripts/install_qt_windows.py --version 6.11.3 --arch win64_mingw \
              --flavor mingw --modules qtshadertools qtwebsockets qtnetworkauth qttasktree \
              --output "$root"
          fi
          echo "QT_ROOT_DIR=$kit" >> "$GITHUB_ENV"
          echo "$kit/bin" >> "$GITHUB_PATH"
          echo "$(cygpath -m "$IQTA_TOOLS")/mingw1310_64/bin" >> "$GITHUB_PATH"

      - name: Build MySQL driver (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          .github/scripts/build_mysql_driver.sh 6.11.3 "$QT_ROOT_DIR" \
            "$(cygpath -m "$IQTA_TOOLS")/mingw1310_64/bin/g++.exe" \
            "$(cygpath -m "$RUNNER_TEMP")/mysql-runtime"
          echo "MYSQL_RUNTIME=$(cygpath -m "$RUNNER_TEMP")/mysql-runtime" >> "$GITHUB_ENV"

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DHYPERLANCER_BUILD_TESTS=OFF

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DHYPERLANCER_BUILD_TESTS=OFF \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_CXX_COMPILER="$IQTA_TOOLS/mingw1310_64/bin/g++.exe"

      - name: Build
        run: cmake --build build --parallel

      - name: Bundle Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = "${{ github.workspace }}\dist\hyperlancer-windows-x64"
          New-Item -ItemType Directory -Force $package | Out-Null
          Copy-Item build\Hyperlancer.exe $package
          windeployqt --release --compiler-runtime --qmldir src\qml --dir $package "$package\Hyperlancer.exe"
          # Qt MySQL driver runtime (libmariadb.dll and its dependencies), built above.
          Copy-Item "$env:MYSQL_RUNTIME\*.dll" $package
          # The analysis tools: the app finds web-dashboard\scripts next to the executable.
          # Run "uv sync --project web-dashboard\scripts" in the unpacked folder once.
          $tools = "$package\web-dashboard\scripts"
          New-Item -ItemType Directory -Force $tools | Out-Null
          Copy-Item web-dashboard\scripts\* $tools -Recurse -Exclude .venv,__pycache__,.pytest_cache
          Compress-Archive -Path $package -DestinationPath dist\hyperlancer-windows-x64.zip

      - name: Bundle Linux runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p AppDir/usr/bin dist
          cp build/Hyperlancer AppDir/usr/bin/
          curl -L --fail --retry 3 -o linuxdeploy.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -L --fail --retry 3 -o linuxdeploy-plugin-qt-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
          export APPIMAGE_EXTRACT_AND_RUN=1
          export QML_SOURCES_PATHS="$GITHUB_WORKSPACE/src/qml"
          ./linuxdeploy.AppImage --appdir AppDir --executable AppDir/usr/bin/Hyperlancer --plugin qt
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          APP_DIR="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          export LD_LIBRARY_PATH="$APP_DIR/usr/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export QT_PLUGIN_PATH="$APP_DIR/usr/plugins"
          export QML2_IMPORT_PATH="$APP_DIR/usr/qml"
          exec "$APP_DIR/usr/bin/Hyperlancer" "$@"
          EOF
          chmod +x AppDir/AppRun
          mv AppDir dist/hyperlancer-linux-x64
          tar -czf dist/hyperlancer-linux-x64.tar.gz -C dist hyperlancer-linux-x64

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/hyperlancer-${{ matrix.platform }}.*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release and packages
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: release-assets/*
