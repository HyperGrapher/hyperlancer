[project]
name = "freelance-dashboard-scripts"
version = "0.1.0"
description = "Site profiler and content crawler used by the Freelance Dashboard"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "certifi>=2024.2.2",
    "defusedxml>=0.7.1",
    "dnspython>=2.6",
    "httpx>=0.27",
    "lxml>=5.2",
    "tldextract>=5.1",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
